[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "split-sentinel"
version = "0.1.0"
description = "Explainable split integrity and leakage risk audits for CSV datasets"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ayano123587"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
leakage-audit = "leakage_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
